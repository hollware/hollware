name: CI

on:
  push:
    branches: [main, release]
  pull_request:
  workflow_dispatch:

permissions: {}

# Wrangler sends anonymous telemetry unless told not to; the Wrangler configs of this
# repository say so too, with send_metrics: false.
env:
  WRANGLER_SEND_METRICS: 'false'

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the changeset check compares with an earlier commit; the guard shipped-migrations reads the release tags
          persist-credentials: false

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          version: 1.1.0
          node-version-file: .node-version
          cache: true

      # The gate judges what lands on main. `release` only takes commits of main that already
      # passed it and whose changesets are consumed, so the check would fail there.
      - name: Check changesets
        if: github.ref != 'refs/heads/release'
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: bash .github/scripts/changeset-check.sh

      - name: Check, test, bench, build, budgets, publint and types
        run: vp run check:push

  # The acceptance suite of the stage, against the built playground and the example site: in
  # process through wrangler's test harness, and over HTTP through `wrangler dev` and the CLI.
  acceptance:
    name: Acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          version: 1.1.0
          node-version-file: .node-version
          cache: true

      - name: Run the acceptance suite
        run: vp run test:acceptance

  # The admin end to end (v0.3): Chromium with a virtual passkey against the built playground
  # under `wrangler dev`, and axe on every page.
  e2e:
    name: E2E (admin)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          version: 1.1.0
          node-version-file: .node-version
          cache: true

      - name: Build the admin
        run: vp run --filter @hollware/admin build

      - name: Install Chromium for Playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: Run the admin end to end
        run: vp run e2e:admin

      - name: Keep the traces of a failed run
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-traces
          path: test-results
          if-no-files-found: ignore
          retention-days: 7

  # The install and the upgrade as a user does them (v0.4): `create-hollware` from a local registry
  # with this checkout's packages, with npm and with pnpm, on Linux and macOS; and a project of
  # 0.3.0 moved to them. They read from npm, so they run beside `check` and do not gate it.
  install:
    name: Install (${{ matrix.os }}, ${{ matrix.pm }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        pm: [npm, pnpm]
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          version: 1.1.0
          node-version-file: .node-version
          cache: true

      - name: Install a new project
        run: node scripts/e2e-install.ts --pm "$PM"
        env:
          PM: ${{ matrix.pm }}

  upgrade:
    name: Upgrade from 0.3.0
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The starter of the release it upgrades from comes from its tag.
          fetch-depth: 0

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          version: 1.1.0
          node-version-file: .node-version
          cache: true

      - name: Upgrade a project of 0.3.0
        run: vp run e2e:upgrade

  # The MCP conformance suite against `wrangler dev` of a Hollware Worker, for both revisions of
  # the specification (ADR-022). It runs beside `check`, which it does not wait for.
  conformance:
    name: MCP conformance
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          version: 1.1.0
          node-version-file: .node-version
          cache: true

      - name: Run the MCP conformance suite
        run: vp run test:conformance

      - name: Keep the results of a failed run
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: conformance-results
          path: tests/conformance/results
          if-no-files-found: ignore
          retention-days: 7

  preview:
    name: Preview packages
    if: github.repository == 'hollware/hollware'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read # pkg.pr.new needs no token: its GitHub App verifies the run and comments on the pull request
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          version: 1.1.0
          node-version-file: .node-version
          cache: true

      - name: Build the packages
        run: vp run -r build

      # Previews go to pkg.pr.new, not to npm, so trusted publishing does not apply.
      - name: Publish previews to pkg.pr.new
        run: pnpm exec pkg-pr-new publish --pnpm './packages/*' # zizmor: ignore[use-trusted-publishing]
