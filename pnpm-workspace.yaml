    typescript: 6.0.3
    vue-tsc: 3.3.14

overrides:
  tsrs@7.1.0-beta.tsrs4: 7.1.0-beta.tsrs5
  node-forge@<1.4.3: 'catalog:'
  undici@7.29.1: 'catalog:'
  vite@*: 'catalog:'
  zod@4.6.6: 'catalog:'

peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: '*'

minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - '@axe-core/playwright@4.14.1' # the latest release on 2026-11-25, taken the day it came out; expires 2026-11-27
  - '@cloudflare/vite-plugin@1.70.2' # the latest release on 2026-11-25, taken the day it came out; expires 2026-11-27
  - '@codemirror/commands@6.11.2' # the latest release on 2026-11-25, taken the day it came out; expires 2026-11-27
  - '@codemirror/merge@6.13.0' # the latest release on 2026-11-25, taken the day it came out; expires 2026-11-27
  - '@codemirror/view@6.44.0' # the latest release on 2026-11-25, taken the day it came out; expires 2026-11-27
  - '@react-router/dev@8.5.3' # the latest release on 2026-11-25, taken the day it came out; expires 2026-11-27
  - '@react-router/node@8.5.3' # the latest release on 2026-11-25, taken the day it came out; expires 2026-11-27
  - '@types/react@19.3.3' # the latest release on 2026-11-25, taken the day it came out; expires 2026-11-27
  - 'react-router@8.5.3' # the latest release on 2026-11-25, taken the day it came out; expires 2026-11-27
trustPolicy: no-downgrade
auditConfig:
  ignoreGhsas:
    - GHSA-vfj7-8cjw-p6xm # braces <=3.0.3, through nitropack's globs of the build config, in apps/web and examples/nuxt-blog only; no release fixes it yet (3.0.3 is the latest on 2026-11-19), micromatch/braces#70; expires 2026-12-19
trustPolicyExclude:
  - tsrs@7.1.0-beta.tsrs5 # the latest beta of oxc's TypeScript port (oxc-project/tsrs, published by its lead), in place of the one vite-plus 1.8.0 pins; npm lists it with a weaker provenance than an earlier beta; expires 2026-12-25
  - semver@6.3.1 # @babel/core 7 (through nuxt's vite-builder) pins the semver 6 line, published before npm had provenance; expires 2026-12-19

allowBuilds:
  esbuild: true # platform binary used by wrangler
  workerd: false # the binary arrives through optionalDependencies (@cloudflare/workerd-*)
  vue-demi: false # its postinstall only switches its files to Vue 2; the ones it ships are for Vue 3
