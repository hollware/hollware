packages:
  - apps/*
  - examples/*
  - packages/*
  - templates/*
  # The Worker that the MCP conformance suite runs against (ADR-022).
  - tests/conformance/*

catalogMode: prefer

# Exact versions only. Each one was published at least 24 hours before it was
# pinned, so it already passes minimumReleaseAge. Keep the list sorted.
catalog:
  '@astrojs/cloudflare': 14.4.0
  # A pre-release: the 2026-07-28 requirement sets exist only in the 0.2 alphas.
  # A release candidate, chosen with Hono 4.13.13 as the fallback (ADR-003, spike S1).
  # The copy the lockfile already holds through @cloudflare/vitest-plugin: pinning a newer one
  # The exact Vitest that vite-plus 1.2.0 depends on. @cloudflare/vitest-plugin
  # The h3 and nitropack that nuxt 4.6.1 runs on: @hollware/nuxt imports both in its runtime.
  # Vite+ ships Vite as @voidzero-dev/vite-plus-core; every package resolves `vite` to it.
  # comark 0.7.0 pins markdown-exit 1.1.0-beta.2 itself (see the v0.1 spike S3).
  # needs it as a real peer dependency.
  # would install zod twice. core and server declare it as a peer, ^4.2.0 (ADR-017).
  '@axe-core/playwright': 4.14.0
  '@cfworker/json-schema': 4.1.1
  '@changesets/changelog-github': 1.0.1
  '@changesets/cli': 3.0.3
  '@cloudflare/vite-plugin': 1.64.0
  '@cloudflare/vitest-plugin': 1.4.3
  '@cloudflare/workers-oauth-provider': 1.2.3
  '@codemirror/commands': 6.11.1
  '@codemirror/lang-markdown': 6.5.2
  '@codemirror/language': 6.13.1
  '@codemirror/lint': 6.9.7
  '@codemirror/merge': 6.12.2
  '@codemirror/state': 6.7.6
  '@codemirror/view': 6.43.14
  '@comark/html': 0.7.0
  '@comark/vue': 0.7.0
  '@fontsource-variable/inter': 5.3.0
  '@fontsource-variable/jetbrains-mono': 5.3.0
  '@iconify-json/lucide': 1.2.144
  '@iconify/utils': 3.1.7
  '@iconify/vue': 5.0.3
  '@lezer/highlight': 1.2.5
  '@modelcontextprotocol/client': 2.3.1
  '@modelcontextprotocol/conformance': 0.2.0-alpha.12
  '@modelcontextprotocol/server': 2.3.1
  '@nuxt/kit': 4.6.1
  '@nuxt/ui': 4.12.0
  '@playwright/test': 1.64.1
  '@simplewebauthn/server': 14.0.3
  '@standard-schema/spec': 1.1.0
  '@tanstack/vue-table': 8.21.3
  '@types/node': 24.19.2
  '@vitejs/plugin-vue': 6.0.10
  astro: 7.4.0
  codemirror: 6.0.2
  comark: 0.7.0
  drizzle-kit: 0.31.11
  drizzle-orm: 0.45.4
  h3: 1.15.11
  hono: 5.0.0-rc.1
  nitropack: 2.13.4
  nuxt: 4.6.1
  pkg-pr-new: 0.0.91
  publint: 0.3.25
  tailwindcss: 4.3.3
  typescript: 7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@1.2.0
  vite-plus: 1.2.0
  vitest: 5.0.4
  vue: 3.5.44
  vue-router: 5.4.0
  wrangler: 4.151.0
  yaml: 2.9.1
  zod: 4.6.7

overrides:
  vite@*: 'catalog:'
  # @cloudflare/vitest-plugin 1.4.3 pins zod 4.6.5 exactly; one zod for the workspace
  # (tests/conventions/single-copies.test.ts), the catalog's, a patch release above it.
  zod@4.6.5: 'catalog:'

peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: '*'

# Supply-chain policy. Never lower minimumReleaseAge; an urgent fix gets an
# exact minimumReleaseAgeExclude entry with a reason and an expiry date.
minimumReleaseAge: 1440
trustPolicy: no-downgrade
# Advisories that `pnpm audit` passes over while they have no fixed version and reach no published
# package (T-92 of docs/security/threat-model.md). Each needs a reason and an expiry date, as the
# excludes above do; the release audits the published packages whatever this says.
auditConfig:
  ignoreGhsas:
    - GHSA-86w9-cpqp-85rv # node-forge <=1.4.0, through listhen, Nuxt's dev server, in apps/web and examples/nuxt-blog only; fix in review, digitalbazaar/forge#1152; expires 2026-11-17
    - GHSA-vfj7-8cjw-p6xm # braces <=3.0.3, through nitropack's globs of the build config, in apps/web and examples/nuxt-blog only; fix in review, micromatch/braces#70; expires 2026-11-17
# Exact versions that trustPolicy refuses while their publisher is the same one. Each needs a
# reason and an expiry date, as minimumReleaseAgeExclude does.
trustPolicyExclude:
  - semver@6.3.1 # @babel/core 7 (through nuxt's vite-builder) pins the semver 6 line, published before npm had provenance; expires 2026-11-15
  - cssnano@9.8.0 # nuxt 4.6.1 needs ^9.4.0; from 9.1.2 npm writes the same trusted publisher id without its "oidc:" prefix; expires 2026-11-15
  - stylehacks@9.0.8 # same as cssnano@9.8.0 above; expires 2026-11-15
  - postcss-unique-selectors@9.0.6 # same as cssnano@9.8.0 above; expires 2026-11-15
  - postcss-reduce-transforms@9.0.6 # same as cssnano@9.8.0 above; expires 2026-11-15
  - postcss-reduce-initial@9.0.7 # same as cssnano@9.8.0 above; expires 2026-11-15
  - postcss-ordered-values@9.0.9 # same as cssnano@9.8.0 above; expires 2026-11-15
  - postcss-normalize-whitespace@9.0.8 # same as cssnano@9.8.0 above; expires 2026-11-15
  - postcss-normalize-url@10.0.0 # same as cssnano@9.8.0 above; expires 2026-11-15
  - postcss-normalize-unicode@9.1.1 # same as cssnano@9.8.0 above; expires 2026-11-15
  - postcss-normalize-timing-functions@9.0.7 # same as cssnano@9.8.0 above; expires 2026-11-15
  - postcss-normalize-string@9.0.7 # same as cssnano@9.8.0 above; expires 2026-11-15
  - postcss-normalize-repeat-style@9.0.7 # same as cssnano@9.8.0 above; expires 2026-11-15
  - postcss-normalize-positions@9.0.8 # same as cssnano@9.8.0 above; expires 2026-11-15
  - postcss-normalize-display-values@9.0.7 # same as cssnano@9.8.0 above; expires 2026-11-15
  - postcss-normalize-charset@9.0.6 # same as cssnano@9.8.0 above; expires 2026-11-15
  - postcss-minify-selectors@9.0.8 # same as cssnano@9.8.0 above; expires 2026-11-15
  - postcss-minify-params@9.1.0 # same as cssnano@9.8.0 above; expires 2026-11-15
  - postcss-minify-gradients@9.0.8 # same as cssnano@9.8.0 above; expires 2026-11-15
  - postcss-minify-font-values@9.0.9 # same as cssnano@9.8.0 above; expires 2026-11-15
  - postcss-merge-rules@9.1.5 # same as cssnano@9.8.0 above; expires 2026-11-15
  - postcss-merge-longhand@9.4.0 # same as cssnano@9.8.0 above; expires 2026-11-15
  - postcss-discard-overridden@9.0.6 # same as cssnano@9.8.0 above; expires 2026-11-15
  - postcss-discard-empty@9.0.8 # same as cssnano@9.8.0 above; expires 2026-11-15
  - postcss-discard-duplicates@9.0.7 # same as cssnano@9.8.0 above; expires 2026-11-15
  - postcss-discard-comments@9.0.8 # same as cssnano@9.8.0 above; expires 2026-11-15
  - postcss-convert-values@9.1.0 # same as cssnano@9.8.0 above; expires 2026-11-15
  - postcss-colormin@9.0.8 # same as cssnano@9.8.0 above; expires 2026-11-15
  - cssnano-utils@9.0.0 # same as cssnano@9.8.0 above; expires 2026-11-15
  - cssnano-preset-default@9.8.0 # same as cssnano@9.8.0 above; expires 2026-11-15

# Build scripts are denied unless listed here with a reason. pnpm 12 fails the
# install on any unlisted build script.
allowBuilds:
  esbuild: true # platform binary used by wrangler
  workerd: false # the binary arrives through optionalDependencies (@cloudflare/workerd-*)
  vue-demi: false # its postinstall only switches its files to Vue 2; the ones it ships are for Vue 3
