name: CI

on:
  push:
    branches: [main, release]
  pull_request:
  workflow_dispatch:

permissions: {}

# Wrangler sends anonymous telemetry unless told not to; the Wrangler configs of this
# repository say so too, with send_metrics: false.
env:
  WRANGLER_SEND_METRICS: 'false'

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the changeset check compares with an earlier commit; the guard shipped-migrations reads the release tags
          persist-credentials: false

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          version: 1.1.0
          node-version-file: .node-version
          cache: true

      # The gate judges what lands on main. `release` only takes commits of main that already
      # passed it and whose changesets are consumed, so the check would fail there.
      - name: Check changesets
        if: github.ref != 'refs/heads/release'
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: bash .github/scripts/changeset-check.sh

      - name: Check, test, bench, build, budgets, publint and types
        run: vp run check:push

  # The MCP conformance suite against `wrangler dev` of a Hollware Worker, for both revisions of
  # the specification (ADR-022). It runs beside `check`, which it does not wait for.
  conformance:
    name: MCP conformance
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          version: 1.1.0
          node-version-file: .node-version
          cache: true

      - name: Run the MCP conformance suite
        run: vp run test:conformance

      - name: Keep the results of a failed run
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: conformance-results
          path: tests/conformance/results
          if-no-files-found: ignore
          retention-days: 7

  preview:
    name: Preview packages
    if: github.repository == 'hollware/hollware'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read # pkg.pr.new needs no token: its GitHub App verifies the run and comments on the pull request
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          version: 1.1.0
          node-version-file: .node-version
          cache: true

      - name: Build the packages
        run: vp run -r build

      # Previews go to pkg.pr.new, not to npm, so trusted publishing does not apply.
      - name: Publish previews to pkg.pr.new
        run: pnpm exec pkg-pr-new publish --pnpm './packages/*' # zizmor: ignore[use-trusted-publishing]
