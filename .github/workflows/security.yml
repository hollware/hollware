name: Security

# OpenSSF Scorecard rejects the results of a workflow that has top-level `env` or
# `defaults`, write permissions at the top, or an OIDC token permission in any
# job but its own. Keep this file clear of all three.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 4 * * 1' # Mondays at 04:23 UTC
  workflow_dispatch:

permissions: {}

concurrency:
  group: security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Review the dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  scorecard:
    name: OpenSSF Scorecard
    # Scorecard supports push and schedule runs of the default branch, and not forks.
    if: github.event_name != 'pull_request' && github.repository == 'hollware/hollware'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write # upload the SARIF results to code scanning
      id-token: write # publish the results and the badge: Scorecard requires it in this job, and in no other job of this file
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload the results to code scanning
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: results.sarif

  zizmor:
    name: zizmor
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Findings fail the job and show as annotations. With code scanning the action
      # would never fail, and fork pull requests could not upload the results.
      - name: Audit the workflows
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          advanced-security: false
          annotations: true

  audit:
    name: Audit production dependencies
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          version: 1.3.0
          node-version-file: .node-version
          run-install: false # the audit reads pnpm-lock.yaml, it needs no node_modules

      - name: Audit the lockfile
        run: pnpm audit --prod --audit-level=high

  repo-settings:
    name: Repository settings
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      # The branch policies of the environments are read with the token of the run.
      actions: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          version: 1.3.0
          node-version-file: .node-version
          run-install: false # the script reads GitHub and one file, it needs no node_modules

      # The rulesets and the environments' branches, which no workflow sets, are those of
      # .github/settings.json (T-91).
      - name: Compare the settings with .github/settings.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/repo-settings.ts

  zap:
    name: ZAP baseline of staging
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The passive scan of OWASP ZAP over staging as a browser reaches it: the headers, cookies,
      # redirects and pages of the Worker, the admin's shell and the sign-in pages. The image is
      # ZAP 2.17.0 by its digest; -I fails only on a rule set to FAIL in .github/zap/rules.tsv.
      - name: Scan staging
        env:
          ZAP_IMAGE: ghcr.io/zaproxy/zaproxy@sha256:5ccfff9a411743ab2615136a2edd7416bec9ce41572fa94e935df38c14adb2b6
        run: |
          mkdir -p zap
          cp .github/zap/rules.tsv zap/rules.tsv
          chmod -R a+rwX zap
          status=0
          for target in / /admin/ /signin /setup; do
            name=$(echo "$target" | tr -c 'a-z0-9\n' '-')
            docker run --rm -v "$PWD/zap:/zap/wrk:rw" "$ZAP_IMAGE" zap-baseline.py \
              -t "https://hollware-staging.sergioazoc.workers.dev${target}" \
              -c rules.tsv -I -j \
              -r "report${name}.html" -J "report${name}.json" || status=$?
          done
          exit "$status"

      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zap-reports
          path: zap/
          retention-days: 30
