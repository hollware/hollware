packages:
  - apps/*
  - examples/*
  - packages/*
  - templates/*
  # The Worker that the MCP conformance suite runs against (ADR-022).
  - tests/conformance/*

catalogMode: prefer

# Exact versions only. Each one was published at least 24 hours before it was
# pinned, so it already passes minimumReleaseAge. Keep the list sorted.
catalog:
  '@changesets/changelog-github': 1.0.1
  '@changesets/cli': 3.0.3
  '@cloudflare/vite-plugin': 1.63.2
  '@cloudflare/vitest-plugin': 1.4.1
  '@cloudflare/workers-oauth-provider': 1.2.3
  '@codemirror/lang-markdown': 6.5.2
  '@codemirror/lint': 6.9.7
  '@codemirror/merge': 6.12.2
  '@codemirror/state': 6.7.6
  '@codemirror/view': 6.43.14
  '@comark/html': 0.7.0
  '@comark/vue': 0.7.0
  '@modelcontextprotocol/client': 2.3.1
  # A pre-release: the 2026-07-28 requirement sets exist only in the 0.2 alphas.
  '@modelcontextprotocol/conformance': 0.2.0-alpha.12
  '@modelcontextprotocol/server': 2.3.1
  '@nuxt/ui': 4.11.3
  '@simplewebauthn/server': 14.0.3
  '@standard-schema/spec': 1.1.0
  '@types/node': 24.19.2
  '@vitejs/plugin-vue': 6.0.10
  codemirror: 6.0.2
  # comark 0.7.0 pins markdown-exit 1.1.0-beta.2 itself (see the v0.1 spike S3).
  comark: 0.7.0
  drizzle-kit: 0.31.11
  drizzle-orm: 0.45.4
  # A release candidate, chosen with Hono 4.13.13 as the fallback (ADR-003, spike S1).
  hono: 5.0.0-rc.1
  pkg-pr-new: 0.0.91
  publint: 0.3.25
  tailwindcss: 4.3.3
  typescript: 7.0.2
  # Vite+ ships Vite as @voidzero-dev/vite-plus-core; every package resolves `vite` to it.
  vite: npm:@voidzero-dev/vite-plus-core@1.1.0
  vite-plus: 1.1.0
  # The exact Vitest that vite-plus 1.1.0 depends on. @cloudflare/vitest-plugin
  # needs it as a real peer dependency.
  vitest: 5.0.3
  vue: 3.5.44
  vue-router: 5.4.0
  wrangler: 4.150.0
  yaml: 2.9.1
  # The copy the lockfile already holds through @cloudflare/vitest-plugin: pinning a newer one
  # would install zod twice. core and server declare it as a peer, ^4.2.0 (ADR-017).
  zod: 4.6.5

overrides:
  vite@*: 'catalog:'

peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: '*'

# Supply-chain policy. Never lower minimumReleaseAge; an urgent fix gets an
# exact minimumReleaseAgeExclude entry with a reason and an expiry date.
minimumReleaseAge: 1440
trustPolicy: no-downgrade

# Build scripts are denied unless listed here with a reason. pnpm 12 fails the
# install on any unlisted build script.
allowBuilds:
  esbuild: true # platform binary used by wrangler
  workerd: false # the binary arrives through optionalDependencies (@cloudflare/workerd-*)
  vue-demi: false # its postinstall only switches its files to Vue 2; the ones it ships are for Vue 3
