name: CI

on:
  push:
    branches: [main, release]
  pull_request:
  workflow_dispatch:

permissions: {}

env:
  WRANGLER_SEND_METRICS: 'false'

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out the repository with its history and release tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          version: 1.3.0
          node-version-file: .node-version
          cache: true

      - name: Check changesets
        if: github.ref != 'refs/heads/release'
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: bash .github/scripts/changeset-check.sh

      - name: Check, test, bench, build, budgets, publint and types
        run: vp run check:push

      - name: Check the public API against the newest promise
        run: node scripts/api-check.ts --against-promise

  acceptance:
    name: Acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          version: 1.3.0
          node-version-file: .node-version
          cache: true

      - name: Run the acceptance suite
        run: vp run test:acceptance

  e2e:
    name: E2E (admin)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          version: 1.3.0
          node-version-file: .node-version
          cache: true

      - name: Build the admin
        run: vp run --filter @hollware/admin build

      - name: Install Chromium for Playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: Run the admin end to end
        run: vp run e2e:admin

      - name: Keep the traces of a failed run
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-traces
          path: test-results
          if-no-files-found: ignore
          retention-days: 7

  install:
    name: Install (${{ matrix.os }}, ${{ matrix.pm }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        pm: [npm, pnpm]
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          version: 1.3.0
          node-version-file: .node-version
          cache: true

      - name: Install a new project
        run: node scripts/e2e-install.ts --pm "$PM"
        env:
          PM: ${{ matrix.pm }}

  upgrade:
    name: Upgrade from ${{ matrix.from }}
    strategy:
      fail-fast: false
      matrix:
        from: ['0.3.0', '0.11.0']
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out the repository with the tags of earlier releases
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          version: 1.3.0
          node-version-file: .node-version
          cache: true

      - name: Upgrade a project of an earlier release
        run: vp run e2e:upgrade -- --from "$FROM"
        env:
          FROM: ${{ matrix.from }}

  conformance:
    name: MCP conformance
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          version: 1.3.0
          node-version-file: .node-version
          cache: true

      - name: Run the MCP conformance suite
        run: vp run test:conformance

      - name: Keep the results of a failed run
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: conformance-results
          path: tests/conformance/results
          if-no-files-found: ignore
          retention-days: 7

  preview:
    name: Preview packages
    if: github.repository == 'hollware/hollware'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          version: 1.3.0
          node-version-file: .node-version
          cache: true

      - name: Build the packages
        run: vp run -r build

      - name: Publish previews to pkg.pr.new, whose GitHub App needs no token
        run: pnpm exec pkg-pr-new publish --pnpm './packages/*' # zizmor: ignore[use-trusted-publishing]
