name: Deploy

# Our deployments (ADR-034): staging on every push to main, and the demo and hollware.com when a
# release is pushed to `release`, each by scripts/deploy.ts, which migrates before it deploys and
# probes after. A push to main has passed the hook pre-push, and one to `release` the check of CI
# that its ruleset asks for. The Cloudflare token lives in the environment `deploy` alone.
on:
  push:
    branches: [main, release]
  workflow_dispatch:
    inputs:
      target:
        description: staging or production
        required: true
        type: choice
        options: [staging, production]

permissions: {}

env:
  WRANGLER_SEND_METRICS: 'false'

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    # Off until the environment `deploy` holds its Cloudflare token, which turns DEPLOY_ENABLED on.
    if: github.repository == 'hollware/hollware' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: deploy
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          version: 1.1.0
          node-version-file: .node-version
          cache: false

      - name: Deploy and probe
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          ASKED: ${{ inputs.target }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then target="$ASKED"
          elif [ "$REF" = "refs/heads/release" ]; then target=production
          else target=staging
          fi
          node scripts/deploy.ts --target "$target"
